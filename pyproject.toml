[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moira-quota-monitor"
version = "0.2.0"
description = "Ubuntu quota monitor for Claude and Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Moira contributors"}]
dependencies = []

[project.scripts]
moira = "moira.app:main"
moira-claude-statusline = "moira.claude_integration:statusline_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/moira/app.py" = ["E402"]
"src/moira/ui.py" = ["E402"]
"src/moira/secrets.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/moira", "tests"]
exclude = ["src/moira/ui.py", "src/moira/app.py", "src/moira/secrets.py"]
